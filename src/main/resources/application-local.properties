# =========================================================
# MOYO local development profile
# Activated automatically when no profile is specified.
# =========================================================

# Optional ignored local secret file. Environment variables take precedence.
spring.config.import=optional:file:./config/application-local-secret.properties

# Oracle local development
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=${MOYO_DB_URL:jdbc:log4jdbc:oracle:thin:@localhost:1521/xepdb1}
spring.datasource.username=${MOYO_DB_USERNAME:scott}
spring.datasource.password=${MOYO_DB_PASSWORD:}

# Local HTTP development
server.servlet.session.cookie.secure=false

# Upload/storage paths
moyo.upload.workspace-dir=${MOYO_WORKSPACE_UPLOAD_DIR:C:/uploads/workspace/}
moyo.upload.workspace-public-prefix=/uploads/workspace/
moyo.upload.user-dir=${MOYO_USER_PROFILE_UPLOAD_DIR:C:/uploads/users/}
moyo.upload.photo-dir=${MOYO_PHOTO_UPLOAD_DIR:C:/uploads/photos/}
moyo.upload.board-dir=${MOYO_BOARD_UPLOAD_DIR:C:/uploads/board/}
moyo.upload.board-editor-dir=${MOYO_BOARD_EDITOR_UPLOAD_DIR:C:/uploads/editor/}
moyo.upload.note-dir=${MOYO_NOTE_UPLOAD_DIR:C:/uploads/notes/}
moyo.upload.note-editor-dir=${MOYO_NOTE_EDITOR_UPLOAD_DIR:C:/uploads/note-editor/}
moyo.upload.poll-dir=${MOYO_POLL_UPLOAD_DIR:C:/uploads/polls/}
moyo.upload.content-file-dir=${MOYO_CONTENT_FILE_DIR:C:/uploads/content-files/}
moyo.upload.inquiry-dir=${MOYO_INQUIRY_UPLOAD_DIR:C:/uploads/inquiry/}
moyo.upload.content-file-max-bytes=${MOYO_CONTENT_FILE_MAX_BYTES:20971520}
moyo.log.dir=${MOYO_LOG_DIR:C:/MoyoLab.Studio/logs}

# Local SMTP: credentials still come from environment variables.
spring.mail.host=${MOYO_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MOYO_MAIL_PORT:587}
spring.mail.username=${MOYO_MAIL_USERNAME:}
spring.mail.password=${MOYO_MAIL_PASSWORD:}
moyo.mail.from=${MOYO_MAIL_FROM:}

# No CORS origin is needed for localhost:8080 -> localhost:8080 same-origin use.
# Set MOYO_ALLOWED_ORIGINS only when intentionally running a separate local front-end origin.

# Legacy development DB compatibility only. Do not enable in production.
moyo.schema.runtime-ddl-enabled=true
