spring.application.name=Moyo
spring.profiles.default=local

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MyBatis
mybatis.mapper-locations=classpath:/mybatis/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Multipart global ceiling.
# Feature-specific limits are enforced again in each upload service.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1GB

# Session / cookie common policy
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Login attack defense
moyo.security.login.max-failures=${MOYO_LOGIN_MAX_FAILURES:5}
moyo.security.login.lock-minutes=${MOYO_LOGIN_LOCK_MINUTES:15}
moyo.security.login.ip-window-minutes=${MOYO_LOGIN_IP_WINDOW_MINUTES:10}
moyo.security.login.ip-max-failures=${MOYO_LOGIN_IP_MAX_FAILURES:20}
moyo.security.login.ip-block-minutes=${MOYO_LOGIN_IP_BLOCK_MINUTES:10}

# Email verification policy
moyo.security.email.code-expiry-minutes=${MOYO_EMAIL_CODE_EXPIRY_MINUTES:5}
moyo.security.email.resend-cooldown-seconds=${MOYO_EMAIL_RESEND_COOLDOWN_SECONDS:60}
moyo.security.email.max-verify-failures=${MOYO_EMAIL_MAX_VERIFY_FAILURES:5}
moyo.security.email.send-window-minutes=${MOYO_EMAIL_SEND_WINDOW_MINUTES:30}
moyo.security.email.max-sends-per-window=${MOYO_EMAIL_MAX_SENDS_PER_WINDOW:5}
moyo.security.email.verified-valid-minutes=${MOYO_EMAIL_VERIFIED_VALID_MINUTES:30}

# SMTP common transport policy.
# Account/password/from address are profile-specific.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CORS secure default: empty means no cross-origin browser caller is allowed.
# Same-origin JSP/API traffic does not require CORS.
moyo.security.cors.allowed-origins=${MOYO_ALLOWED_ORIGINS:}

# Error response hardening
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.path=/error

# Server fingerprint
server.server-header=

# Runtime DDL is disabled by default. Production must keep this false.
moyo.schema.runtime-ddl-enabled=false

# Public holiday API key. Secret value is supplied by local secret file or environment.
moyo.calendar.holiday-service-key=${MOYO_HOLIDAY_SERVICE_KEY:}
