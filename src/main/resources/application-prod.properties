# =========================================================
# MOYO production profile
# Run with: --spring.profiles.active=prod
# Secrets and machine-specific paths must be supplied by environment variables.
# =========================================================

# Oracle production
# Example MOYO_DB_URL: jdbc:oracle:thin:@//db-host:1521/service_name
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${MOYO_DB_URL}
spring.datasource.username=${MOYO_DB_USERNAME}
spring.datasource.password=${MOYO_DB_PASSWORD}

# Production HTTPS
#server.servlet.session.cookie.secure=true
server.servlet.session.cookie.secure=false

# Upload/storage paths
moyo.upload.workspace-dir=${MOYO_WORKSPACE_UPLOAD_DIR:D:/MOYO/uploads/workspace/}
moyo.upload.workspace-public-prefix=/uploads/workspace/
moyo.upload.user-dir=${MOYO_USER_PROFILE_UPLOAD_DIR:D:/MOYO/uploads/users/}
moyo.upload.photo-dir=${MOYO_PHOTO_UPLOAD_DIR:D:/MOYO/uploads/photos/}
moyo.upload.board-dir=${MOYO_BOARD_UPLOAD_DIR:D:/MOYO/uploads/board/}
moyo.upload.board-editor-dir=${MOYO_BOARD_EDITOR_UPLOAD_DIR:D:/MOYO/uploads/editor/}
moyo.upload.note-dir=${MOYO_NOTE_UPLOAD_DIR:D:/MOYO/uploads/notes/}
moyo.upload.note-editor-dir=${MOYO_NOTE_EDITOR_UPLOAD_DIR:D:/MOYO/uploads/note-editor/}
moyo.upload.poll-dir=${MOYO_POLL_UPLOAD_DIR:D:/MOYO/uploads/polls/}
moyo.upload.content-file-dir=${MOYO_CONTENT_FILE_DIR:D:/MOYO/uploads/content-files/}
moyo.upload.inquiry-dir=${MOYO_INQUIRY_UPLOAD_DIR:D:/MOYO/uploads/inquiry/}
moyo.upload.content-file-max-bytes=${MOYO_CONTENT_FILE_MAX_BYTES:20971520}
moyo.log.dir=${MOYO_LOG_DIR}

# SMTP
spring.mail.host=${MOYO_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MOYO_MAIL_PORT:587}
spring.mail.username=${MOYO_MAIL_USERNAME}
spring.mail.password=${MOYO_MAIL_PASSWORD}
moyo.mail.from=${MOYO_MAIL_FROM}

# CORS
# MOYO is same-origin by design. Leave MOYO_ALLOWED_ORIGINS empty unless a separate
# trusted web origin genuinely needs browser access.
# Multiple origins: https://app.example.com,https://admin.example.com
moyo.security.cors.allowed-origins=${MOYO_ALLOWED_ORIGINS:}

# Security: web requests/schedulers must never alter production schema.
moyo.schema.runtime-ddl-enabled=false

# Production hardening
spring.devtools.restart.enabled=false
spring.jmx.enabled=false
management.endpoints.enabled-by-default=false
